<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="24%" r="80%">
      <stop offset="0%" stop-color="#241c3f"/>
      <stop offset="55%" stop-color="#14101f"/>
      <stop offset="100%" stop-color="#09070f"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7dd97"/>
      <stop offset="50%" stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#c98f2c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b84b" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e8b84b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8b84b" stop-opacity="0.55"/>
    </linearGradient>
</defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGlow)"/>

  <g fill="#f7dd97" opacity="0.28">
    <circle cx="110" cy="70" r="1.5"/>
    <circle cx="1180" cy="80" r="1.5"/>
    <circle cx="60" cy="360" r="1.2"/>
    <circle cx="1225" cy="360" r="1.2"/>
    <circle cx="110" cy="655" r="1.4"/>
    <circle cx="1180" cy="650" r="1.4"/>
  </g>

  <rect x="18" y="18" width="1244" height="684" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="30" y="30" width="1220" height="660" rx="12" fill="none" stroke="#e8b84b" stroke-opacity="0.16" stroke-width="1"/>

  <text x="70" y="62" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#c9a45c">D&amp;D 5.5e ALL-IN-ONE BEYOND</text>
  <text x="1210" y="62" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#8f88a3">14 / 14</text>
  <text x="70" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="url(#goldGrad)">Level 6</text>
  <text x="1210" y="128" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="800" fill="url(#goldGrad)">5</text>
  <text x="1210" y="160" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#9089a8">level 6 spells</text>
<text x="70" y="172" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#9089a8">Circle of Death through Planar Ally — new spells alongside 5.5e-revised classics.</text>
  <line x1="70" y1="195" x2="1210" y2="195" stroke="#e8b84b" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="70" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#e8b84b">Circle of Death</tspan><tspan fill="#cdc4e0"> — 8d8 Necrotic damage in an 18m-radius sphere</tspan></text>
<text x="70" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#e8b84b">Disintegrate</tspan><tspan fill="#cdc4e0"> — Creatures that succeed on the save still take 40 Force</tspan></text>
<text x="70" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#cdc4e0">damage</text>
<text x="670" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#e8b84b">Freezing Sphere</tspan><tspan fill="#cdc4e0"> — Now explodes in a 60-ft radius; can be hurled up to 300 ft</tspan></text>
<text x="670" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#e8b84b">Mental Prison</tspan><tspan fill="#cdc4e0"> — 5d10 Psychic; on a failed save Confused and Restrained</tspan></text>
<text x="670" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13.5"><tspan font-weight="700" fill="#e8b84b">Planar Ally</tspan><tspan fill="#cdc4e0"> — Now Concentration; summon a Cambion, Deva, or Djinni ally</tspan></text>
</svg>
